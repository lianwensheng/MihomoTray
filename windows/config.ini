; MihomoTray 配置文件（修改后重启小工具生效）
; MihomoTray config (restart the tray app after editing)
[mihomo]
; external-controller 地址
; external-controller address
controller = 127.0.0.1:9090
; external-controller 的 secret，没有就留空（请只用 ASCII 字母、数字和符号）
; secret for external-controller (leave empty if none; ASCII letters/digits/symbols only)
secret = 
; 点击“打开面板”时打开的网址
; URL opened by Dashboard / left-click
panel_url = http://127.0.0.1:9090/ui/
; 点击“切换程序”时启动的程序（通常是某个 mihomo 内核图形客户端的主程序，.exe 或 .lnk 快捷方式都行），留空则该菜单项变灰
; Program launched by Open App (usually a mihomo GUI client .exe or .lnk); leave empty to gray out the item
; 支持带空格/带引号的路径、环境变量（如 %LOCALAPPDATA%）、相对路径（相对本小工具 exe 所在文件夹）
; Paths may contain spaces/quotes, env vars (e.g. %LOCALAPPDATA%), or be relative to this app's folder
; 例：switch_program = C:\Program Files\FlClash\FlClash.exe
; Example: switch_program = C:\Program Files\FlClash\FlClash.exe
;     switch_program = %LOCALAPPDATA%\Programs\某客户端\某客户端.exe
;     switch_program = %LOCALAPPDATA%\Programs\SomeClient\SomeClient.exe
switch_program = 
; 启动上面程序时附带的命令行参数，一般留空
; Extra command-line args for the program above (usually empty)
switch_program_args = 
; 轮询当前模式的间隔（秒）
; Poll interval for current mode (seconds)
poll_interval = 3
; 切换模式后是否断开现有连接，让已建立的连接也立即按新模式走（设为 false 则只影响新连接）
; Close existing connections after switching mode (false = only new connections use the new mode)
close_connections = true

[ui]
; 界面语言：system（跟随系统）/ zh（中文）/ en（英文）
; UI language: system (follow OS) / zh (Chinese) / en (English)
language = system
; 菜单主题：system（跟随系统）/ light（浅色）/ dark（深色）
; Menu theme: system (follow OS) / light / dark
; light 与 FlClash 原版一致（原版不启用深色菜单，始终是系统浅色菜单）
; light matches FlClash (native menu stays light even if the OS is dark)
theme = light
; 开机自启：true（开启）/ false（关闭，默认）；每次启动时按这里同步系统设置
; Start with Windows: true / false (default); synced to the system on every start
autostart = false
